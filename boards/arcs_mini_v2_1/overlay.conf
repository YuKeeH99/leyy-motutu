CONFIG_BOARD_ARCS_MINI_V2_1=y
CONFIG_BOARD_ARCS_MINI_MODEM_UART2_REMAP=n

# Local GPIO/PWM; MPU6050 and PN532 share I2C0 on PB06/PB07.
CONFIG_LISA_GPIO_DEVICE=y
CONFIG_LISA_GPIOA=y
CONFIG_LISA_GPIOB=y
CONFIG_LISA_PWM=y
CONFIG_LISA_I2C=y
CONFIG_LISA_I2C0=y
CONFIG_LISA_I2C1=n

# PA04/PA05 and PA08/PA09 are no longer robot/modem UART pins.
CONFIG_LISA_UART1=n
CONFIG_LISA_UART2=n
# Keep the modem component linked for the shared SAL symbols used by lisa_net.
# With UART2 disabled, an empty lisa_uart2_pinmux(), and the legacy remap off,
# it cannot claim any v2.1 expansion pin.
CONFIG_LISA_MODEM=y

# PA04-PA09 must remain available to PWM/GPIO; no SDIO/SDMMC muxing.
CONFIG_LISA_SDMMC_DEVICE=n
CONFIG_DISK_DRIVER_SDMMC=n
CONFIG_MIDDLEWARE_SD_MUSIC=n

# PA12 is MPU_INT; PA10/PA11 are reserved. DVP/camera stays disabled.
CONFIG_LISA_CAMERA_DEVICE=n
CONFIG_LISA_CAMERA_BUS_DVP=n
CONFIG_LISA_CAMERA_SENSOR_GC0328=n
CONFIG_LISA_DVP_DEVICE=n
CONFIG_MCP_TOOL_CAMERA_ENABLE=n

# PA09 is a discrete touch-sensor GPIO, not the display touch controller.
CONFIG_LISA_TOUCH_DEVICE=n

# Only mic1 (ADC left) is connected. AEC uses playback PCM as its reference;
# ADC right/mic2 is unconnected. See doc/AEC方案.md before changing.
CONFIG_ACOMP_WAKEUP_ALGORITHM_TYPE_SINGLE_MIC=y
CONFIG_ACOMP_WAKEUP_ALGORITHM_TYPE_DUAL_MIC=n
CONFIG_AUDIO_AEC_REFERENCE_SOFTWARE=y
CONFIG_AUDIO_AEC_REFERENCE_HARDWARE=n
CONFIG_LISA_AUDIO_PLAY_ECHO_NONE=n
CONFIG_LISA_AUDIO_PLAY_ECHO_ENABLE=n
CONFIG_LISA_AUDIO_PLAY_SOFT_ECHO=y
CONFIG_AUDIO_DEFAULT_MIC_GAIN_A_DB=30
CONFIG_AUDIO_DEFAULT_MIC_GAIN_D_DB=0
CONFIG_AUDIO_DEFAULT_REF_GAIN_A_DB=30
CONFIG_AUDIO_DEFAULT_REF_GAIN_D_DB=0
CONFIG_AUDIO_TDOA_ENABLE=n
# Measured V2.1 acoustic-port centre-to-centre distance is approximately
# 20 mm (value is in 0.1 mm). Refine this after fixture calibration.
CONFIG_AUDIO_TDOA_MIC_SPACING_TENTH_MM=200
# Measured at matched 30 dB gain: enclosure silence stayed at or below about
# 0.251 normalized correlation, while both front and left fixtures reached
# about 0.61. Place the block threshold at 0.35. Live front/left tests showed
# 2 coherent blocks in some real speech windows while repeated quiet windows
# produced zero, so V2.1 uses two-block aggregation. Amplitude gates are scaled from
# the EVB 36 dB baseline for 30 dB.
CONFIG_AUDIO_TDOA_MIN_MEAN_ABS=150
CONFIG_AUDIO_TDOA_MIN_PEAK=750
CONFIG_AUDIO_TDOA_MIN_CORRELATION_MILLI=350
CONFIG_AUDIO_TDOA_MIN_ACTIVE_BLOCKS=2
# Physical LEFT/MIC0 and FRONT/MIC1 excitation produced a repeatable channel
# balance magnitude above about 0.06, while ambiguous onset windows stayed
# below it. Fuse this calibrated inter-channel level difference with TDOA.
CONFIG_AUDIO_TDOA_LEVEL_DOMINANCE_MILLI=60

# This SKU is running as a headless voice device, so keep the display stack
# disabled to reduce SRAM/PSRAM pressure and remove LVGL/UI dependencies.
CONFIG_LISA_DISPLAY_DEVICE=n
CONFIG_BOOT_DISPLAY=n

# MTT shares I2C0 between MPU6050 and PN532; PA13 is the second TTP223.
# Unused host UAC export can destabilize the composite ADB interface.
CONFIG_APP_USB_AUDIO_ENABLE=n

# Product behavior switches. Large-motion policy gates are disabled for this
# small toy; actuator hard limits and upside-down recovery remain active.
CONFIG_APP_V2_GAIT_SAFETY_GATES_ENABLE=n
# PN532 is not used in the current product build.
CONFIG_APP_V2_NFC_PEER_ENABLE=n
